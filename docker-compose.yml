version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: traveloop_user
      POSTGRES_PASSWORD: traveloop_password
      POSTGRES_DB: traveloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: traveloop_user
      DB_PASSWORD: traveloop_password
      DB_NAME: traveloop
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
